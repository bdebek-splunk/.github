name: fix-issues-with-ai

on: 
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AGENTCORE_AGENT_ARN:
        required: true
      S3_BUCKET:
        required: true
    outputs:
      pr_number:
        description: "The PR number created by the AI agent"
        value: ${{ jobs.fix-issue.outputs.pr_number }}

jobs:
  fix-issue:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Add comment to the issue
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🤖 AI Fix Automation

            This issue will be analyzed by an AI to suggest potential fixes. A pull request will be created if a solution is found.

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv pip install --system boto3

      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Delete AWS files after installation
        id: cleanup-after-aws-installation
        run: |
          rm -f awscliv2.zip
          rm -rf aws

      - name: Create branch
        id: create-branch
        run: |
          BRANCH_NAME="ai_fix_$(date +'%Y%m%d_%H%M%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Download AppInspect failures report
        uses: actions/download-artifact@v4
        with:
          name: appinspect_result_private_victoria
          path: appinspect_results

      - name: Copy AppInspect result
        run: |
          # Produce the exact format that _filter_report_for_errors exports:
          # [{"group_name": "...", "check_messages": [{"message": "...", "message_filename": "...", "message_line": ...}]}]
          jq '[
            .reports[0].groups[] |
            . as $group |
            .checks[] |
            select(.result == "failure") |
            {
              group_name: $group.name,
              check_messages: [
                .messages[] |
                select(.result == "failure") |
                {message: .message, message_filename: .message_filename, message_line: .message_line}
              ]
            }
          ]' appinspect_results/appinspect_result.json > appinspect_result.json
          echo "=== appinspect_result.json ==="
          cat appinspect_result.json
          echo "=== Failures found ==="
          jq 'length' appinspect_result.json

      - name: Zip and upload repo to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BUCKET=$(echo "${S3_BUCKET}" | xargs)
          S3_URI="s3://${BUCKET}/repos/${RUN_ID}/${REPO_NAME}.tar.gz"
          # Archive with repo name as the top-level directory so agent finds it at /tmp/working/${REPO_NAME}
          cd ..
          tar --exclude="./${REPO_NAME}/.git" \
              --exclude="./${REPO_NAME}/appinspect_results" \
              --exclude="./${REPO_NAME}/appinspect_result.json" \
              -czf "/tmp/${REPO_NAME}.tar.gz" "./${REPO_NAME}"
          echo "Uploading to: ${S3_URI}"
          aws s3 cp "/tmp/${REPO_NAME}.tar.gz" "${S3_URI}"

      - name: Analyze and fix issues with AI agent
        id: invoke-agent-runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AGENTCORE_AGENT_ARN: ${{ secrets.AGENTCORE_AGENT_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Write prompt to a file to avoid "Argument list too long"
          cat > prompt.txt << 'PROMPT_EOF'
          Please assess the vetting report errors and fix them all in the app.
          Before doing anything, make sure to read the vetting report until the end.
          The vetting report is provided in the field "vetting_report" of the payload.
          Then attempt to fix the app.
          Do not ask for permission or conformation, just do it!

          IMPORTANT: This is a UCC-based Splunk app. The repository root contains a "package/" subdirectory which is the actual Splunk app source.
          The app files to fix are located at: /tmp/working/fdse_test_oracle_sbc_app_for_splunk_ucc/package/
          When you need to package the app for vetting, use the path: /tmp/working/fdse_test_oracle_sbc_app_for_splunk_ucc/package

          Write me a summary of the changes performed like you would write the summary of a Pull Request!

          Thanks!
          PROMPT_EOF

          BUCKET=$(echo "${S3_BUCKET}" | xargs)

          # Build payload - vetting_report is a pre-filtered flat list of failures
          # matching the output of _filter_report_for_errors, passed as a JSON string
          jq -n \
            --arg repo "${REPO_NAME}" \
            --arg bucket "${BUCKET}" \
            --arg key "repos/${RUN_ID}/${REPO_NAME}.tar.gz" \
            --rawfile prompt prompt.txt \
            --rawfile vetting appinspect_result.json \
            '{gh_repo_name: $repo, s3_bucket: $bucket, s3_key: $key, prompt: $prompt, vetting_report: $vetting}' > payload.json

          echo "Starting agent..."

          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "${AGENTCORE_AGENT_ARN}" \
            --region "${AWS_REGION}" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 600 \
            --cli-connect-timeout 60 \
            --payload file://payload.json \
            --output json \
            ./out.json

          echo "=== Agent Output Log ==="
          cat ./out.json

      - name: Parse agent output
        id: parse-output
        run: |
          echo "=== Raw Agent Output ==="
          cat ./out.json

          RAW=$(grep '^data:' ./out.json | tail -n1 | sed 's/^data: //')
          FIRST_CHAR=$(echo "$RAW" | cut -c1)
          if [ "$FIRST_CHAR" = '"' ]; then
            INNER_JSON=$(echo "$RAW" | jq -r 'fromjson')
          else
            INNER_JSON=$(echo "$RAW" | jq '.')
          fi

          echo "=== Parsed Inner JSON ==="
          echo "$INNER_JSON" | jq '.'
          echo "=== Available keys ==="
          echo "$INNER_JSON" | jq 'keys'

          # Check for error in the response
          if echo "$INNER_JSON" | jq -e '.error' > /dev/null 2>&1; then
            echo "ERROR from agent: $(echo "$INNER_JSON" | jq -r '.error')" >&2
            exit 1
          fi

          # Try agent_answer first, fall back to other common keys
          ANSWER=$(echo "$INNER_JSON" | jq -r '.agent_answer // .answer // .response // .result // .output // "No answer field found in agent response"')
          echo "$ANSWER" > agent_answer.md
          echo "=== Agent Answer ==="
          cat agent_answer.md

      - name: Download and unzip updated repo from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BUCKET=$(echo "${S3_BUCKET}" | xargs)
          S3_URI="s3://${BUCKET}/repos/${RUN_ID}/${REPO_NAME}.tar.gz"
          echo "Downloading from: ${S3_URI}"
          aws s3 cp "${S3_URI}" /tmp/updated_repo.tar.gz
          # Extract into parent dir — archive root is ${REPO_NAME}/, so files land in workspace
          tar -xzf /tmp/updated_repo.tar.gz -C ..

      - name: Cleanup S3 artifact
        if: always() # runs even if previous steps failed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BUCKET=$(echo "${S3_BUCKET}" | xargs)
          aws s3 rm "s3://${BUCKET}/repos/${RUN_ID}/${REPO_NAME}.tar.gz"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout ${{ steps.create-branch.outputs.branch_name }}
          # Exclude temp/workflow files from commit
          git add -A
          git reset HEAD -- appinspect_result.json appinspect_results/ out.json payload.json prompt.txt updated_repo.tar.gz agent_answer.md || true
          git diff --staged --quiet || git commit -m "fix: AI automated fix for issue #${{ github.event.issue.number }}"
          git push origin ${{ steps.create-branch.outputs.branch_name }}

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "fix: AI automated fix for issue #${{ github.event.issue.number }}" \
            --body-file agent_answer.md \
            --base main \
            --head ${{ steps.create-branch.outputs.branch_name }})
          PR_NUMBER=$(echo $PR_URL | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
