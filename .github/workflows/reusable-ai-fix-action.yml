name: fix-issues-with-ai

on: 
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
    outputs:
      pr_number:
        description: "The PR number created by the AI agent"
        value: ${{ jobs.fix-issue.outputs.pr_number }}

jobs:
  fix-issue:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Add comment to the issue
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🤖 AI Fix Automation

            This issue will be analyzed by an AI to suggest potential fixes. A pull request will be created if a solution is found.

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load config from appforgeai-controller/config.yaml
        run: |
          python3 - << 'EOF'
          import yaml, os
          with open(".github/appforgeai-controller/config.yaml") as f:
              cfg = yaml.safe_load(f)
          aws = cfg.get("aws", {})
          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a") as ef:
              ef.write(f"AWS_REGION={aws['region']}\n")
              ef.write(f"S3_BUCKET={aws['s3']['bucket']}\n")
              ef.write(f"S3_PREFIX={aws['s3']['prefix']}\n")
              ef.write(f"AGENTCORE_AGENT_ARN={aws['agentcore']['runtime_arn']}\n")
          EOF

      - name: Set up Python 3.11.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv pip install --system boto3

      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Delete AWS files after installation
        id: cleanup-after-aws-installation
        run: |
          rm -f awscliv2.zip
          rm -rf aws

      - name: Create branch
        id: create-branch
        run: |
          BRANCH_NAME="ai_fix_$(date +'%Y%m%d_%H%M%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Download AppInspect failures report
        uses: actions/download-artifact@v4
        with:
          name: appinspect_result_private_victoria
          path: appinspect_results

      - name: Copy AppInspect result
        run: |
          cp appinspect_results/appinspect_result.json appinspect_result.json
          echo "=== appinspect_result.json ==="
          cat appinspect_result.json

      - name: Zip and upload repo to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BUCKET=$(echo "${S3_BUCKET}" | xargs)
          PREFIX=$(echo "${S3_PREFIX}" | xargs)
          S3_URI="s3://${BUCKET}/${PREFIX}/${RUN_ID}/${REPO_NAME}.tar.gz"
          # Archive with repo name as the top-level directory so agent finds it at /tmp/working/${REPO_NAME}
          cd ..
          tar --exclude="./${REPO_NAME}/.git" \
              --exclude="./${REPO_NAME}/appinspect_results" \
              --exclude="./${REPO_NAME}/appinspect_result.json" \
              -czf "/tmp/${REPO_NAME}.tar.gz" "./${REPO_NAME}"
          echo "Uploading to: ${S3_URI}"
          aws s3 cp "/tmp/${REPO_NAME}.tar.gz" "${S3_URI}"

      - name: Filter vetting report to failures only
        run: |
          jq '[.reports[0].groups[].checks[] | select(.result == "failure") | {
            check_name: .name,
            group_name: (.description // ""),
            check_messages: [.messages[] | {
              message: .message,
              message_filename: .message_filename,
              message_line: .message_line
            }]
          }]' appinspect_result.json > vetting_failures.json
          echo "Failures found: $(jq length vetting_failures.json)"

      - name: Analyze and fix issues with AI agent
        id: invoke-agent-runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          BOTOCORE_TCP_KEEPALIVE: "true"
        run: |
          # Write prompt to a file to avoid "Argument list too long"
          cat > prompt.txt << 'PROMPT_EOF'
          # Role
          You are an automated Splunk app maintainer. Your single job is to resolve
          every finding in the supplied vetting report by editing the app source on
          disk and re-uploading the fixed archive. Work autonomously -- do not ask
          for permission or confirmation.
          
          # Inputs (already in the JSON payload you received)
          - `gh_repo_name`: the GitHub repo name (`{repo_name}`). The source has been
            extracted for you to `/tmp/working/{repo_name}/`.
          - `s3_bucket` + `s3_key`: the S3 object that holds the archive. After you
            finish, you MUST repackage the app and overwrite this exact bucket+key
            with the fixed tree -- this is how the calling pipeline picks the fix up.
          - `vetting_report`: a JSON-encoded list of failures
          
          # Repository layout (IMPORTANT)
          The repository root contains a `package/` sub-directory which holds the
          editable Splunk app source AND an `output/<app_name>/` sub-directory
          which is the AppInspect-built form of the same app (produced by
          `ucc-gen build` for UCC apps, or a plain copy of `package/` otherwise).
          The vetting report was generated against `output/<app_name>/`, but
          fixes MUST be applied to the source under `package/` so they survive
          the next build. Therefore:
          - Read `output/<app_name>/` only as a reference for what AppInspect
            saw when it produced the report.
          - Edit files under `/tmp/working/{repo_name}/package/`.
          - When you repackage the app for re-upload, use
            `/tmp/working/{repo_name}/package` as the package root (NOT the repo
            root, and NOT `output/`).
          
          # Process
          1. Read the entire `vetting_report` before touching anything. Group entries
             by `message_filename` so each file is opened at most once.
          2. For each failure, locate the offending file/line and apply the smallest
             change that resolves the finding while preserving runtime behaviour.
          3. When several findings touch the same file, batch the edits and write
             the file once.
          4. Prefer editing existing files over adding new ones. Only create a new
             file if a finding genuinely requires it (e.g. missing `README`,
             `LICENSE`, or a manifest file). New files MUST live under `package/`.
          5. After all edits, repackage the app and upload it back to the SAME
             `s3_bucket`/`s3_key`, overwriting the original archive.
          
          # Constraints (hard rules)
          - Make minimal, targeted changes. Do not refactor unrelated code, reorder
            imports, reformat untouched files, or rename variables.
          - Do not bump the app `version` (in `default/app.conf` or
            `app.manifest`) unless a finding explicitly requires it.
          - Do not touch the `[id]`, `[launcher]`, or `[install]` stanzas of
            `default/app.conf` unless the finding targets that stanza directly.
          - Preserve existing file encodings, line endings and trailing newlines.
          - Do not delete or rename files that are not the subject of a finding.
          - Do not introduce third-party dependencies that are not already vendored.
          - Do not modify anything outside `/tmp/working/{repo_name}/package/`.
          
          # Output
          Set `agent_answer` to a Pull-Request-style markdown body with these
          sections, in this exact order:
          
          - `## Summary` -- one paragraph (2-4 sentences) describing what you did in the format of a table as below:
          Fixed | Error | File(s) affected | Fix applied |
          ✅ |-------|-----------------|-------------|
          - `## Findings addressed` -- bullet list, one line per fixed finding,
            formatted as `- <group_name>: <one-line description of the fix>`.
          - `## Findings skipped` -- bullet list of findings you did NOT fix, each
            with a one-line reason. Omit this section if the list is empty.
          - `## Files changed` -- bullet list of relative paths (under `package/`)
            that you modified or created.
          
          If you cannot make any progress at all (e.g. the report is empty, or
          unparseable, or every entry is impossible to fix), do NOT modify the S3
          object and reply with `{{"error": "<one-line reason>"}}` instead of
          `agent_answer`.
          PROMPT_EOF

          BUCKET=$(echo "${S3_BUCKET}" | xargs)
          PREFIX=$(echo "${S3_PREFIX}" | xargs)

          # Build payload - vetting_report is a pre-filtered flat list of failures
          # matching the output of _filter_report_for_errors, passed as a JSON string
          jq -n \
            --arg repo "${{ github.run_id }}/${{ github.event.repository.name }}" \
            --rawfile prompt prompt.txt \
            --rawfile vetting appinspect_result.json \
            '{package_name: $repo, prompt: $prompt, vetting_failures: $vetting}' > payload.json

          echo "=== payload.json ==="
          jq . payload.json
          
          echo "Starting agent..."

          # || true: a CLI read-timeout (exit 255) means the agent ran longer than
          # the socket wait, but the agent continues running and will still upload
          # the fixed repo to S3. We capture whatever partial output arrived and
          # proceed — the parse step will handle missing/error output gracefully.
          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "${AGENTCORE_AGENT_ARN}" \
            --region "${AWS_REGION}" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60 \
            --payload file://payload.json \
            --output json \
            ./out.json || true

          echo "=== Agent Output Log ==="
          cat ./out.json || echo "(no output captured)"

      - name: Parse agent output
        id: parse-output
        run: |
          echo "=== Raw Agent Output ==="
          cat ./out.json 2>/dev/null || echo "(out.json not present — likely a read timeout; agent may have still completed)"

          # If out.json is missing or empty, skip parsing and write a placeholder
          if [ ! -s ./out.json ]; then
            echo "Agent response not captured (read timeout). Proceeding to download fixed repo from S3." > agent_answer.md
            exit 0
          fi

          RAW=$(grep '^data:' ./out.json | tail -n1 | sed 's/^data: //')
          FIRST_CHAR=$(echo "$RAW" | cut -c1)
          if [ "$FIRST_CHAR" = '"' ]; then
            INNER_JSON=$(echo "$RAW" | jq -r 'fromjson')
          else
            INNER_JSON=$(echo "$RAW" | jq '.')
          fi

          echo "=== Parsed Inner JSON ==="
          echo "$INNER_JSON" | jq '.'
          echo "=== Available keys ==="
          echo "$INNER_JSON" | jq 'keys'

          # Check for error in the response
          if echo "$INNER_JSON" | jq -e '.error' > /dev/null 2>&1; then
            echo "ERROR from agent: $(echo "$INNER_JSON" | jq -r '.error')" >&2
            exit 1
          fi

          # Try agent_answer first, fall back to other common keys
          ANSWER=$(echo "$INNER_JSON" | jq -r '.agent_answer // .answer // .response // .result // .output // "No answer field found in agent response"')
          echo "$ANSWER" > agent_answer.md
          echo "=== Agent Answer ==="
          cat agent_answer.md

      - name: Download and unzip updated repo from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BUCKET=$(echo "${S3_BUCKET}" | xargs)
          PREFIX=$(echo "${S3_PREFIX}" | xargs)
          S3_URI="s3://${BUCKET}/${PREFIX}/${RUN_ID}/${REPO_NAME}.tar.gz"
          echo "Downloading from: ${S3_URI}"
          aws s3 cp "${S3_URI}" /tmp/updated_repo.tar.gz
          # Extract into parent dir — archive root is ${REPO_NAME}/, so files land in workspace
          tar -xzf /tmp/updated_repo.tar.gz -C ..

      - name: Cleanup S3 artifact
        if: always() # runs even if previous steps failed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BUCKET=$(echo "${S3_BUCKET}" | xargs)
          PREFIX=$(echo "${S3_PREFIX}" | xargs)
          aws s3 rm "s3://${BUCKET}/${PREFIX}/${RUN_ID}/${REPO_NAME}.tar.gz"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout ${{ steps.create-branch.outputs.branch_name }}
          # Exclude temp/workflow files from commit
          git add -A
          git reset HEAD -- appinspect_result.json appinspect_results/ out.json payload.json prompt.txt updated_repo.tar.gz agent_answer.md || true
          git diff --staged --quiet || git commit -m "fix: AI automated fix for issue #${{ github.event.issue.number }}"
          git push origin ${{ steps.create-branch.outputs.branch_name }}

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "fix: AI automated fix for issue #${{ github.event.issue.number }}" \
            --body-file agent_answer.md \
            --base main \
            --head ${{ steps.create-branch.outputs.branch_name }})
          PR_NUMBER=$(echo $PR_URL | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
