name: fix-issues-with-ai

on: 
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AGENTCORE_AGENT_ARN:
        required: true
      S3_BUCKET:
        required: true
    outputs:
      pr_number:
        description: "The PR number created by the AI agent"
        value: ${{ jobs.fix-issue.outputs.pr_number }}

jobs:
  fix-issue:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Add comment to the issue
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🤖 AI Fix Automation

            This issue will be analyzed by an AI to suggest potential fixes. A pull request will be created if a solution is found.

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv pip install --system boto3

      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Delete AWS files after installation
        id: cleanup-after-aws-installation
        run: |
          rm -f awscliv2.zip
          rm -rf aws

      - name: Create branch
        id: create-branch
        run: |
          BRANCH_NAME="ai_fix_$(date +'%Y%m%d_%H%M%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Download AppInspect failures report
        uses: actions/download-artifact@v4
        with:
          name: appinspect-result

      - name: Zip and upload repo to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd ..
          zip -r ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}
          aws s3 cp ${{ github.event.repository.name }}.zip s3://${{ secrets.S3_BUCKET }}/repos/${{ github.run_id }}/${{ github.event.repository.name }}.zip

      - name: Analyze and fix issues with AI agent
        id: invoke-agent-runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          VETTING_CONTENT=$(cat appinspect_result.json | jq -c '.')

          PROMPT="Please assess the vetting report errors and fix them all in the app.
          Before doing anything, make sure to read the vetting report until the end. It is here: $VETTING_CONTENT
          Then attempt to fix the app.
          Do not ask for permission or conformation, just do it!

          Write me a summary of the changes perfromed like you would write the summary of a Pull Request!

          Thanks!"

          PAYLOAD=$(jq -n \
            --arg repo "${{ github.event.repository.name }}" \
            --arg bucket "${{ secrets.S3_BUCKET }}" \
            --arg key "repos/${{ github.run_id }}/${{ github.event.repository.name }}.zip" \
            --arg prompt "$PROMPT" \
            '{gh_repo_name: $repo, s3_bucket: $bucket, s3_key: $key, prompt: $prompt}')

          echo "Starting agent with prompt $PROMPT"

          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn ${{ secrets.AGENTCORE_AGENT_ARN }} \
            --region ${{ secrets.AWS_REGION }} \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 600 \
            --cli-connect-timeout 60 \
            --payload "$PAYLOAD" \
            --output json \
            ./out.json

          echo "=== Agent Output Log ==="
          cat ./out.json

      - name: Parse agent output
        id: parse-output
        run: |
          echo "=== Raw Agent Output ==="
          cat ./out.json

          RAW=$(grep '^data:' ./out.json | tail -n1 | sed 's/^data: //')
          FIRST_CHAR=$(echo "$RAW" | cut -c1)
          if [ "$FIRST_CHAR" = '"' ]; then
            INNER_JSON=$(echo "$RAW" | jq -r 'fromjson')
          else
            INNER_JSON=$(echo "$RAW" | jq '.')
          fi

          echo "=== Parsed Inner JSON ==="
          echo "$INNER_JSON" | jq '.'

          # Check for error in the response
          if echo "$INNER_JSON" | jq -e '.error' > /dev/null 2>&1; then
            echo "ERROR from agent: $(echo "$INNER_JSON" | jq -r '.error')" >&2
            exit 1
          fi

          echo "$INNER_JSON" | jq -r '.agent_answer' > agent_answer.md
          echo "=== Agent Answer ==="
          cat agent_answer.md

      - name: Download and unzip updated repo from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/repos/${{ github.run_id }}/${{ github.event.repository.name }}.zip ./updated_repo.zip
          cd ..
          unzip -o ${{ github.workspace }}/updated_repo.zip

      - name: Cleanup S3 artifact
        if: always() # runs even if previous steps failed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 rm s3://${{ secrets.S3_BUCKET }}/repos/${{ github.run_id }}/${{ github.event.repository.name }}.zip

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout ${{ steps.create-branch.outputs.branch_name }}
          git add -A
          git diff --staged --quiet || git commit -m "fix: AI automated fix for issue #${{ github.event.issue.number }}"
          git push origin ${{ steps.create-branch.outputs.branch_name }}

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "fix: AI automated fix for issue #${{ github.event.issue.number }}" \
            --body-file agent_answer.md \
            --base main \
            --head ${{ steps.create-branch.outputs.branch_name }})
          PR_NUMBER=$(echo $PR_URL | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
